name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: ""
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Plugin Uninstaller ${{ github.ref_name }}"
          releaseBody: "See the assets below. Installers: .msi/.exe (Windows), .dmg (macOS), .deb/.rpm/.AppImage (Linux). Portable builds (no install, data kept next to the app): *_portable.zip (Windows, macOS) and *_portable.tar.gz (Linux)."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
      - name: Package portable (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: |
          VER=${GITHUB_REF_NAME#v}
          OUT="Plugin-Uninstaller_${VER}_x64_portable.zip"
          mkdir PluginUninstaller-portable
          cp src-tauri/target/release/plugin-uninstaller.exe PluginUninstaller-portable/
          cp packaging/portable.txt PluginUninstaller-portable/
          pwsh -NoProfile -Command "Compress-Archive -Path PluginUninstaller-portable -DestinationPath '$OUT' -Force"
          bash packaging/upload-asset.sh "$OUT"
          echo "PORTABLE_FILE=$OUT" >> "$GITHUB_ENV"
      - name: Package portable (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: |
          VER=${GITHUB_REF_NAME#v}
          OUT="Plugin-Uninstaller_${VER}_amd64_portable.tar.gz"
          mkdir PluginUninstaller-portable
          cp src-tauri/target/release/bundle/appimage/*.AppImage PluginUninstaller-portable/
          chmod +x PluginUninstaller-portable/*.AppImage
          cp packaging/portable.txt PluginUninstaller-portable/
          tar -czf "$OUT" PluginUninstaller-portable
          bash packaging/upload-asset.sh "$OUT"
          echo "PORTABLE_FILE=$OUT" >> "$GITHUB_ENV"
      - name: Package portable (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: |
          VER=${GITHUB_REF_NAME#v}
          OUT="Plugin-Uninstaller_${VER}_universal_portable.zip"
          mkdir PluginUninstaller-portable
          cp -R "src-tauri/target/universal-apple-darwin/release/bundle/macos/Plugin Uninstaller.app" PluginUninstaller-portable/
          cp packaging/portable.txt PluginUninstaller-portable/
          ditto -c -k --sequesterRsrc --keepParent PluginUninstaller-portable "$OUT"
          bash packaging/upload-asset.sh "$OUT"
          echo "PORTABLE_FILE=$OUT" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: portable-${{ runner.os }}
          path: ${{ env.PORTABLE_FILE }}
          if-no-files-found: error
