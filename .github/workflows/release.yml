name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.1.0-rc.1 (created if it does not exist)"
        required: true
        type: string

env:
  # The tag being released: the pushed tag, or the manual input.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./packaging/check-version.sh "$RELEASE_TAG"

  release:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: ""
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "Deplug ${{ env.RELEASE_TAG }}"
          releaseBody: "See the assets below. Installers: .msi/.exe (Windows), .dmg (macOS), .deb/.rpm/.AppImage (Linux). Portable builds (no install, data kept next to the app): *_portable.zip (Windows, macOS) and *_portable.tar.gz (Linux)."
          releaseDraft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          args: ${{ matrix.args }}
      - name: Package portable (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: |
          VER=${RELEASE_TAG#v}
          OUT="Deplug_${VER}_x64_portable.zip"
          mkdir Deplug-portable
          cp src-tauri/target/release/deplug.exe Deplug-portable/
          cp packaging/portable.txt Deplug-portable/
          pwsh -NoProfile -Command "Compress-Archive -Path Deplug-portable -DestinationPath '$OUT' -Force"
          bash packaging/upload-asset.sh "$OUT"
          echo "PORTABLE_FILE=$OUT" >> "$GITHUB_ENV"
      - name: Package portable (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: |
          VER=${RELEASE_TAG#v}
          OUT="Deplug_${VER}_amd64_portable.tar.gz"
          mkdir Deplug-portable
          cp src-tauri/target/release/bundle/appimage/*.AppImage Deplug-portable/
          chmod +x Deplug-portable/*.AppImage
          cp packaging/portable.txt Deplug-portable/
          tar -czf "$OUT" Deplug-portable
          bash packaging/upload-asset.sh "$OUT"
          echo "PORTABLE_FILE=$OUT" >> "$GITHUB_ENV"
      - name: Package portable (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: |
          VER=${RELEASE_TAG#v}
          OUT="Deplug_${VER}_universal_portable.zip"
          mkdir Deplug-portable
          cp -R "src-tauri/target/universal-apple-darwin/release/bundle/macos/Deplug.app" Deplug-portable/
          cp packaging/portable.txt Deplug-portable/
          ditto -c -k --sequesterRsrc --keepParent Deplug-portable "$OUT"
          bash packaging/upload-asset.sh "$OUT"
          echo "PORTABLE_FILE=$OUT" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: portable-${{ runner.os }}
          path: ${{ env.PORTABLE_FILE }}
          if-no-files-found: error
