name: Release

# Started by hand (Actions > Release > Run workflow). It is deliberately not triggered by tag pushes:
# publishing the draft creates the tag, and a build on that push would touch the published release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.1.0-rc.1 (created if it does not exist)"
        required: true
        type: string

env:
  # The tag being released (manual input).
  RELEASE_TAG: ${{ inputs.tag }}

permissions:
  contents: write

jobs:
  verify-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: ./packaging/check-version.sh "$RELEASE_TAG"
      - name: Check updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error title=Missing secret TAURI_SIGNING_PRIVATE_KEY::The repository secret TAURI_SIGNING_PRIVATE_KEY is not set. It signs the in-app updater artifacts and the build fails without it. Generate a key pair with 'npx tauri signer generate' (no password), put the private key in this secret and the public key in src-tauri/tauri.conf.json (plugins.updater.pubkey). See the Releases section of docs/building-from-source.md."
            exit 1
          fi

  release:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: ""
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          {
            echo "RELEASE_BODY<<RELEASE_NOTES_EOF"
            ./packaging/release-notes.sh "$RELEASE_TAG"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts (.sig). The key has no password: the secret may stay unset/empty.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "Deplug ${{ env.RELEASE_TAG }}"
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          args: ${{ matrix.args }}
          # Uploads latest.json (signed updater manifest) next to the installers and their .sig files.
          includeUpdaterJson: true
      - name: Package portable (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: |
          VER=${RELEASE_TAG#v}
          OUT="Deplug_${VER}_x64_portable.zip"
          mkdir Deplug-portable
          cp src-tauri/target/release/deplug.exe Deplug-portable/
          cp packaging/portable.txt Deplug-portable/
          pwsh -NoProfile -Command "Compress-Archive -Path Deplug-portable -DestinationPath '$OUT' -Force"
          bash packaging/upload-asset.sh "$OUT"
          echo "PORTABLE_FILE=$OUT" >> "$GITHUB_ENV"
      - name: Package portable (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: |
          VER=${RELEASE_TAG#v}
          OUT="Deplug_${VER}_amd64_portable.tar.gz"
          mkdir Deplug-portable
          cp src-tauri/target/release/bundle/appimage/*.AppImage Deplug-portable/
          chmod +x Deplug-portable/*.AppImage
          cp packaging/portable.txt Deplug-portable/
          tar -czf "$OUT" Deplug-portable
          bash packaging/upload-asset.sh "$OUT"
          echo "PORTABLE_FILE=$OUT" >> "$GITHUB_ENV"
      - name: Package portable (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: |
          VER=${RELEASE_TAG#v}
          OUT="Deplug_${VER}_universal_portable.zip"
          mkdir Deplug-portable
          cp -R "src-tauri/target/universal-apple-darwin/release/bundle/macos/Deplug.app" Deplug-portable/
          cp packaging/portable.txt Deplug-portable/
          ditto -c -k --sequesterRsrc --keepParent Deplug-portable "$OUT"
          bash packaging/upload-asset.sh "$OUT"
          echo "PORTABLE_FILE=$OUT" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v6
        with:
          name: portable-${{ runner.os }}
          path: ${{ env.PORTABLE_FILE }}
          if-no-files-found: error
